[platformio]
src_dir = src
build_dir = .pio/build

[env:wokwi]
platform = atmelavr
board = uno
framework = arduino
build_flags = -DWOKWI_SIMULATION
lib_deps =
  arduino-libraries/LiquidCrystal @ ^1.0.7

[env:browser]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  arduino-libraries/LiquidCrystal @ ^1.0.7

