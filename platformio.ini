[platformio]
src_dir = src
build_dir = .pio/build

[env:hardware]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
build_flags = -DSYNTH_FIXED_OUTPUT_MODE=CHA -mcall-prologues -mrelax -Wl,--relax
  -fno-inline-small-functions -fno-move-loop-invariants -mstrict-X
  -fno-tree-switch-conversion
lib_deps =
  arduino-libraries/LiquidCrystal @ ^1.0.7

